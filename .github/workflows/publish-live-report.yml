name: Publish Live Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-live-report.yml"
      - "data/config/**"
      - "pyproject.toml"
      - "src/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-live-report
  cancel-in-progress: false

jobs:
  build:
    name: Build live report artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run daily data pipeline
        run: python -m kenai_engine.cli run-daily

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public JSON artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/public

  deploy:
    name: Deploy live report to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
